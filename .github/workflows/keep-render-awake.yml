name: Keep Render App Awake

on:
  schedule:
    # Runs every 14 minutes to prevent Render from spinning down (spins down after 15 mins of inactivity)
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: curl -sSf https://gem-compliancelens-1.onrender.com/health || exit 0
